services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: bokning_spetsen
      POSTGRES_USER: bokning_spetsen
      POSTGRES_PASSWORD: bokning_spetsen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bokning_spetsen -d bokning_spetsen']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
